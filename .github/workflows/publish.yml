name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BLOG_TITLE: ${{ secrets.BLOG_TITLE || 'My Blog' }}
  BLOG_URL: ${{ secrets.BLOG_URL || 'https://bytenoob.io' }}
  BLOG_AUTHOR: ${{ secrets.BLOG_AUTHOR || 'bytenoob' }}
  BLOG_EMAIL: ${{ secrets.BLOG_EMAIL || 'blog@example.com' }}
  BLOG_DESCRIPTION: ${{ secrets.BLOG_DESCRIPTION || 'A technical blog about programming and technology' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Node.js dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm install -g terser cssnano postcss postcss-cli
          fi

      - name: Install Emacs
        run: |
          sudo apt update
          sudo apt-get install -y emacs
          echo "Emacs version: $(emacs --version | head -n1)"

      - name: Build the site
        run: |
          chmod +x build.sh
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          ./build.sh
        env:
          CI: true
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Generate sitemap
        run: |
          if [ -f generate-sitemap.sh ]; then
            chmod +x generate-sitemap.sh
            ./generate-sitemap.sh
          fi

      - name: Minify assets for production
        run: |
          if [ -f minify.sh ]; then
            chmod +x minify.sh
            ./minify.sh
          fi

      - name: List generated files
        run: |
          echo "📁 Checking build output:"
          if [ -d "public" ]; then
            echo "✅ public directory exists"
            find public -type f -name "*.html" | sort
            echo ""
            echo "📊 Build statistics:"
            echo "Total HTML files: $(find public -name "*.html" | wc -l)"
            echo "Total size: $(du -sh public | cut -f1)"
          else
            echo "❌ public directory not found!"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
