name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  BLOG_URL: 'https://pr-${{ github.event.pull_request.number }}.preview.example.com'
  BLOG_AUTHOR: ${{ secrets.BLOG_AUTHOR || 'bytenoob' }}
  BLOG_EMAIL: ${{ secrets.BLOG_EMAIL || 'blog@example.com' }}

# A newer push to the same PR supersedes the running preview
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm install -g terser cssnano postcss postcss-cli
          fi

      - name: Install Emacs
        run: |
          sudo apt update
          sudo apt-get install -y emacs

      - name: Build the site
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          CI: true
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Generate sitemap
        run: |
          if [ -f generate-sitemap.sh ]; then
            chmod +x generate-sitemap.sh
            ./generate-sitemap.sh
          fi

      - name: Check site
        run: ./check-site.sh

      - name: Collect build statistics
        id: stats
        run: |
          echo "html_count=$(find public -name '*.html' | wc -l)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -sh public | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: public
          retention-days: 7

      - name: Comment PR
        # Fork PRs get a read-only token and cannot comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const comment = `## 🔍 Preview Build Complete!

            Build #${{ github.run_number }} has finished successfully.

            📦 [Download preview artifact](${artifactUrl})

            ### Build Statistics:
            - Total HTML files: \`${{ steps.stats.outputs.html_count }}\`
            - Build size: \`${{ steps.stats.outputs.size }}\`
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
