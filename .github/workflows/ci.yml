name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt update
          sudo apt-get install -y emacs

      - name: Lint Org files (advisory)
        run: |
          echo "🔍 Running org-lint (warnings only; does not fail the build)..."
          for file in posts/*.org; do
            emacs --batch --eval "(progn (require 'org-lint) (find-file \"$file\")
              (dolist (i (org-lint))
                (princ (format \"::warning file=%s,line=%s::%s\\n\" \"$file\" (aref (cadr i) 0) (aref (cadr i) 2)))))" 2>/dev/null
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          format: gcc
          severity: warning

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Emacs
        run: |
          sudo apt update
          sudo apt-get install -y emacs

      - name: Test build
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          CI: true
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Minify assets
        run: ./minify.sh

      - name: Check site
        # Metadata, published pages and internal links (shared with publish)
        run: ./check-site.sh
